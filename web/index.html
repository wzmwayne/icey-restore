<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ICEY · 网页版（教程关切片）</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:#0b0b0e; color:#d8d8e0;
              font:13px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif; overflow:hidden;
              user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
              touch-action:none; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  canvas, .bar, .btn, #stick, #knob { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
  .bar { position:fixed; left:10px; top:10px; z-index:5; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
         background:rgba(12,12,18,.78); border:1px solid #2a2a36; border-radius:10px; padding:8px 10px; backdrop-filter:blur(6px); }
  .bar b { color:#8ae0ff; font-weight:600; letter-spacing:.5px; }
  select,button,input { background:#171722; color:#d8d8e0; border:1px solid #33334a; border-radius:6px; padding:4px 8px; font:inherit; }
  button:active { background:#23233a; }
  .on { background:#1d3a4a; border-color:#3d7a96; color:#a9e8ff; }
  #hint { position:fixed; left:10px; bottom:10px; z-index:5; max-width:52ch; color:#8b8b9c; }
  #pad { position:fixed; inset:auto 0 0 0; z-index:6; display:none; padding:14px 16px 18px;
         justify-content:space-between; align-items:flex-end; pointer-events:none; }
  #pad.mobile { display:flex; }
  .grp { display:flex; gap:12px; pointer-events:auto; }
  .btn { width:58px; height:58px; line-height:1.05; font-size:13px; border-radius:50%; border:1px solid #4a4a66; flex-direction:column; background:rgba(22,22,34,.72);
         color:#e6e6f0; font-size:15px; display:flex; align-items:center; justify-content:center;
         user-select:none; -webkit-user-select:none; touch-action:none; }
  .btn.press { background:rgba(80,140,190,.55); border-color:#7cc4e8; }
  .btn.wide { width:auto; padding:0 18px; border-radius:14px; height:52px; }
  .btn small { display:block; font-size:9px; color:#a9b6c6; }
  #stick { position:relative; width:138px; height:138px; border-radius:50%;
           border:1px solid #4a4a66; background:radial-gradient(circle at 50% 50%, rgba(30,30,46,.65), rgba(16,16,26,.45));
           pointer-events:auto; touch-action:none; }
  #stick::after { content:''; position:absolute; inset:22px; border-radius:50%; border:1px dashed #3a3a52; }
  #knob { position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px;
          border-radius:50%; background:rgba(124,196,232,.45); border:1px solid #7cc4e8;
          box-shadow:0 0 12px rgba(124,196,232,.35); will-change:transform;
          display:flex; align-items:center; justify-content:center; }
  #knob i { width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent;
            border-bottom:10px solid #eaf6ff; opacity:.85; transform:rotate(var(--rot,0deg)); }
  #stick.act { border-color:#7cc4e8; box-shadow:0 0 14px rgba(124,196,232,.35) inset; }
  #dpad { display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(3,44px); gap:4px;
          pointer-events:auto; touch-action:none; }
  #dpad[hidden] { display:none; }
  .dbtn { display:flex; align-items:center; justify-content:center; border-radius:10px;
          border:1px solid #4a4a66; background:rgba(22,22,34,.7); color:#dbe6f2; font-size:16px; }
  .dbtn.center { border:0; background:transparent; }
  .dbtn.press { background:rgba(80,140,190,.55); border-color:#7cc4e8; }
  #keys { position:fixed; right:10px; top:10px; z-index:7; display:none; background:rgba(12,12,18,.92);
          border:1px solid #2a2a36; border-radius:10px; padding:10px 12px; }
  #keys.show { display:block; }
  #keys table { border-collapse:collapse; }
  #keys td { padding:3px 6px; }
  #keys input { width:70px; text-align:center; }
  .fps { color:#6f6f80; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<div class="bar">
  <b>ICEY · WEB SLICE</b>
  <select id="scene"></select>
  <button id="btnFit" title="把整关框进视野">适配视野</button>
  <button id="btnFollow" class="on">跟随</button>
  <button id="btnZoomIn">－</button><button id="btnZoomOut">＋</button>
  <button id="btnHide">隐藏辅助</button>
  <button id="btnVpad" title="移动端虚拟按键">虚拟按键</button>
  <button id="btnDirMode" title="方向输入：摇杆 / 十字键">方向：摇杆</button>
  <button id="btnKeys">键位</button>
  <span class="fps" id="stat"></span>
</div>

<div id="keys">
  <table>
    <tr><td>左</td><td><input data-k="left" maxlength="8"></td><td>右</td><td><input data-k="right" maxlength="8"></td></tr>
    <tr><td>上</td><td><input data-k="up" maxlength="8"></td><td>下</td><td><input data-k="down" maxlength="8"></td></tr>
    <tr><td>轻攻击</td><td><input data-k="attack" maxlength="8"></td><td>重攻击</td><td><input data-k="heavy" maxlength="8"></td></tr>
    <tr><td>跳跃</td><td><input data-k="jump" maxlength="8"></td><td>闪避/位移</td><td><input data-k="dash" maxlength="8"></td></tr>
    <tr><td>裁决回血</td><td><input data-k="execute" maxlength="8"></td><td>特殊</td><td><input data-k="special" maxlength="8"></td></tr>
    <tr><td>大螺旋</td><td><input data-k="spiral" maxlength="8"></td><td>闪现攻击</td><td><input data-k="flash" maxlength="8"></td></tr>
    <tr><td>选择·左</td><td><input data-k="choiceL" maxlength="8"></td><td>选择·右</td><td><input data-k="choiceR" maxlength="8"></td></tr>
  </table>
  <div style="margin-top:6px"><button id="btnReset">恢复默认</button></div>
  <div style="margin-top:6px;color:#8b8b9c">点输入框后按一个键即可改绑（存本机）</div>
</div>

<div id="pad">
  <div class="grp">
    <div id="stick"><div id="knob"><i></i></div></div>
    <div id="dpad" hidden>
      <div class="dbtn" data-dir="3">↖</div><div class="dbtn" data-dir="2">↑</div><div class="dbtn" data-dir="1">↗</div>
      <div class="dbtn" data-dir="4">←</div><div class="dbtn center">·</div><div class="dbtn" data-dir="0">→</div>
      <div class="dbtn" data-dir="5">↙</div><div class="dbtn" data-dir="6">↓</div><div class="dbtn" data-dir="7">↘</div>
    </div>
  </div>
  <div class="grp">
    <div class="btn" data-act="choiceL">Q</div>
    <div class="btn" data-act="choiceR">E</div>
  </div>
  <div class="grp">
    <div class="btn" data-act="spiral">N<small>大螺旋</small></div>
    <div class="btn" data-act="flash">M<small>闪现</small></div>
    <div class="btn" data-act="execute">O<small>裁决</small></div>
    <div class="btn" data-act="special">U<small>特殊</small></div>
    <div class="btn" data-act="heavy">I<small>重攻</small></div>
    <div class="btn" data-act="attack">J<small>轻攻</small></div>
    <div class="btn" data-act="dash">L<small>闪避</small></div>
    <div class="btn" data-act="jump">K<small>跳跃</small></div>
  </div>
</div>

<div id="hint">键盘默认（网络通行键位）：A/D 移动 · <b>J</b> 轻攻击 · <b>I</b> 重攻击 · <b>K</b> 跳跃 · <b>L</b> 闪避/位移 · <b>O</b> 裁决回血(QTE) · <b>N</b> 大螺旋 · <b>M</b> 闪现攻击 · <b>U</b> 特殊 · Q/E 选择（可在「键位」里改）。
素材为占位：本页已加载由你自己的游戏包导出的教程关精灵与布局；角色/敌人/UI 将在后续步骤接入。</div>

<script src="viewer.js"></script>
</body>
</html>
