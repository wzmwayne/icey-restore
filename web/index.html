<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ICEY · 教程切片（类 Unity 运行时 · 默认入口）</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:#0b0b0e; color:#d8d8e0; overflow:hidden;
              font:13px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
              user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
              touch-action:none; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
  .bar { position:fixed; left:10px; top:10px; z-index:5; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
         background:rgba(12,12,18,.78); border:1px solid #2a2a36; border-radius:10px; padding:8px 10px; backdrop-filter:blur(6px); }
  .bar b { color:#8ae0ff; font-weight:600; letter-spacing:.5px; }
  select,button,input { background:#171722; color:#d8d8e0; border:1px solid #33334a; border-radius:6px; padding:4px 8px; font:inherit; }
  button:active { background:#23233a; }
  .on { background:#1d3a4a; border-color:#3d7a96; color:#a9e8ff; }
  .fps { color:#6f6f80; }
  #pad { position:fixed; inset:auto 0 0 0; z-index:6; display:none; padding:14px 16px 18px;
         justify-content:space-between; align-items:flex-end; pointer-events:none; }
  #pad.mobile { display:flex; }
  .grp { display:flex; gap:10px; pointer-events:auto; }
  .btn { width:58px; height:58px; border-radius:50%; border:1px solid #4a4a66; background:rgba(22,22,34,.72);
         color:#e6e6f0; font-size:13px; display:flex; flex-direction:column; align-items:center; justify-content:center;
         user-select:none; touch-action:none; }
  .btn small { display:block; font-size:9px; color:#a9b6c6; }
  .btn.press { background:rgba(80,140,190,.55); border-color:#7cc4e8; }
  #stick { position:relative; width:138px; height:138px; border-radius:50%; border:1px solid #4a4a66;
           background:radial-gradient(circle at 50% 50%, rgba(30,30,46,.65), rgba(16,16,26,.45)); pointer-events:auto; touch-action:none; }
  #stick::after { content:''; position:absolute; inset:22px; border-radius:50%; border:1px dashed #3a3a52; }
  #stick.act { border-color:#7cc4e8; }
  #knob { position:absolute; left:50%; top:50%; width:58px; height:58px; margin:-29px 0 0 -29px; border-radius:50%;
          background:rgba(124,196,232,.45); border:1px solid #7cc4e8; display:flex; align-items:center; justify-content:center; will-change:transform; }
  #knob i { width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:10px solid #eaf6ff; opacity:.85; transform:rotate(var(--rot,0deg)); }
  #dpad { display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(3,44px); gap:4px; pointer-events:auto; touch-action:none; }
  #dpad[hidden] { display:none; }
  .dbtn { display:flex; align-items:center; justify-content:center; border-radius:10px; border:1px solid #4a4a66;
          background:rgba(22,22,34,.7); color:#dbe6f2; font-size:16px; }
  .dbtn.center { border:0; background:transparent; }
  .dbtn.press { background:rgba(80,140,190,.55); border-color:#7cc4e8; }
  #keys { position:fixed; right:10px; top:10px; z-index:7; display:none; background:rgba(12,12,18,.92);
          border:1px solid #2a2a36; border-radius:10px; padding:10px 12px; }
  #keys.show { display:block; }
  #keys td { padding:3px 6px; }
  #keys input { width:70px; text-align:center; }
  #tut { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:6; max-width:min(78ch,86vw);
         background:rgba(12,12,18,.88); border:1px solid #33506a; border-left:3px solid #7cc4e8; border-radius:10px;
         padding:9px 14px; display:none; align-items:baseline; gap:10px; }
  #tut.show { display:flex; }
  #tut b { color:#7cc4e8; font-weight:600; white-space:nowrap; }
  #tut span { color:#e6eef8; }
  #tut i { color:#8b8b9c; font-style:normal; margin-left:auto; white-space:nowrap; }
  #vid { position:fixed; inset:0; z-index:20; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
  #vid[hidden] { display:none; }
  #vid video { width:100%; max-height:78vh; background:#000; }
  #diag { position:fixed; left:8px; bottom:8px; z-index:30; max-width:70vw; background:rgba(60,10,14,.92);
          border:1px solid #a04040; border-radius:8px; padding:6px 10px; color:#ffd9d9; font:12px/1.5 monospace; white-space:pre-wrap; }
  #diag[hidden] { display:none; }
  #btnDev { position:fixed; right:10px; bottom:10px; z-index:9; width:38px; height:38px; border-radius:50%;
            background:rgba(22,22,34,.55); border:1px solid #3a3a52; color:#9fb3c6; font-size:16px; opacity:.55; }
  #btnDev:hover { opacity:1; }
  .bar[hidden] { display:none; }
  #keys, #tut { z-index:8; }
  #hint { position:fixed; left:10px; bottom:8px; z-index:5; color:#8b8b9c; max-width:60ch; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<button id="btnDev" title="调试面板 · 构建 1016121612">⚙</button>
<div id="diag" hidden></div>
<div class="bar" hidden>
  <b>ICEY · UNITY-LIKE</b>
  <select id="scene"></select>
  <button id="btnFit">适配视野</button>
  <button id="btnGizmo">碰撞盒</button>
  <button id="btnVpad">虚拟按键</button>
  <button id="btnDirMode">方向：摇杆</button>
  <button id="btnKeys">键位</button>
  <label style="color:#8b8b9c">难度
    <select id="difficulty"><option value="0">0（默认）</option><option value="1">1</option><option value="2">2</option></select>
  </label>
  <a href="legacy.html" style="color:#8b8b9c;text-decoration:none;border:1px solid #33334a;border-radius:6px;padding:4px 8px">旧版(手写渲染)</a>
  <span class="fps" id="stat"></span>
</div>

<div id="keys">
  <table>
    <tr><td>左</td><td><input data-k="left" maxlength="8"></td><td>右</td><td><input data-k="right" maxlength="8"></td></tr>
    <tr><td>上</td><td><input data-k="up" maxlength="8"></td><td>下</td><td><input data-k="down" maxlength="8"></td></tr>
    <tr><td>轻攻击</td><td><input data-k="attack" maxlength="8"></td><td>重攻击</td><td><input data-k="heavy" maxlength="8"></td></tr>
    <tr><td>跳跃</td><td><input data-k="jump" maxlength="8"></td><td>闪避/位移</td><td><input data-k="dash" maxlength="8"></td></tr>
    <tr><td>裁决回血</td><td><input data-k="execute" maxlength="8"></td><td>特殊</td><td><input data-k="special" maxlength="8"></td></tr>
    <tr><td>大螺旋</td><td><input data-k="spiral" maxlength="8"></td><td>闪现攻击</td><td><input data-k="flash" maxlength="8"></td></tr>
    <tr><td>选择·左</td><td><input data-k="choiceL" maxlength="8"></td><td>选择·右</td><td><input data-k="choiceR" maxlength="8"></td></tr>
  </table>
  <div style="margin-top:6px"><button id="btnReset">恢复默认</button></div>
</div>

<div id="pad">
  <div class="grp">
    <div id="stick"><div id="knob"><i></i></div></div>
    <div id="dpad" hidden>
      <div class="dbtn" data-dir="3">↖</div><div class="dbtn" data-dir="2">↑</div><div class="dbtn" data-dir="1">↗</div>
      <div class="dbtn" data-dir="4">←</div><div class="dbtn center">·</div><div class="dbtn" data-dir="0">→</div>
      <div class="dbtn" data-dir="5">↙</div><div class="dbtn" data-dir="6">↓</div><div class="dbtn" data-dir="7">↘</div>
    </div>
  </div>
  <div class="grp">
    <div class="btn" data-act="choiceL">Q<small>选择</small></div>
    <div class="btn" data-act="choiceR">E<small>选择</small></div>
  </div>
  <div class="grp">
    <div class="btn" data-act="spiral">N<small>大螺旋</small></div>
    <div class="btn" data-act="flash">M<small>闪现</small></div>
    <div class="btn" data-act="execute">O<small>裁决</small></div>
    <div class="btn" data-act="special">U<small>特殊</small></div>
    <div class="btn" data-act="heavy">I<small>重攻</small></div>
    <div class="btn" data-act="attack">J<small>轻攻</small></div>
    <div class="btn" data-act="dash">L<small>闪避</small></div>
    <div class="btn" data-act="jump">K<small>跳跃</small></div>
  </div>
</div>

<div id="hint" hidden>类 Unity 运行时（engine/core.js + render2d.js + sceneLoader.js）：场景由 UnityPy 导出的 scene.json 实例化。

  <div><button data-v="1">教程1</button> <button data-v="2">教程2</button> <button data-v="3">教程3</button> <button id="vidClose">关闭</button></div>
</div>

</body>
